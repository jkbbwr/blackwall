version = 1
name = "go-dev"
extends = ["base"]

[image]
base = "debian:bookworm-slim"
packages = [
  "ca-certificates",
  "git",
  "curl",
  "ripgrep",
  "jq",
  "build-essential",
  "pkg-config",
]
run = [
  "curl -fsSL https://go.dev/dl/go1.24.2.linux-amd64.tar.gz | tar -xz -C /usr/local",
  "ln -sf /usr/local/go/bin/go /usr/local/go/bin/gofmt /usr/local/bin/",
  "mkdir -p /workspace /home/sandbox && useradd -m -u 1000 -s /bin/bash sandbox 2>/dev/null || true && chown -R 1000:1000 /workspace /home/sandbox",
]

[compute]
vcpus = 4
memory_mib = 4096
workspace_mib = 4096
idle_timeout_sec = 900
max_wall_time_sec = 7200

[network]
mode = "egress"

[[network.http]]
host = "proxy.golang.org"
methods = ["GET", "HEAD"]
path_prefixes = ["/"]

[[network.http]]
host = "sum.golang.org"
methods = ["GET", "HEAD"]
path_prefixes = ["/"]

[[network.http]]
host = "storage.googleapis.com"
methods = ["GET", "HEAD"]
path_prefixes = ["/proxy-golang-org-prod/"]

[ingress]
allow_ports = [3000, 8000, 8080]

[env]
GOROOT = "/usr/local/go"
GOPATH = "/workspace/.go"
GOMODCACHE = "/workspace/.go/pkg/mod"
GOCACHE = "/workspace/.go-cache"
GOPROXY = "https://proxy.golang.org,direct"
