# Composable GitHub mixin profile (e.g. `blackwall create --profile ts-dev --profile github`).
#
# Provides git + GitHub CLI (`gh`) and HTTPS egress to GitHub (including `POST /graphql`
# required by `gh`, and smart-HTTP git clone/fetch/push on `github.com`).
# Note: SSH (port 22) is intentionally not proxied; use HTTPS + a sealed fine-grained PAT
# so `blackwall-proxy` can inspect paths, inject auth from memfd_secret, and audit calls.
#
# For brokered `GITHUB_TOKEN` injection, seal your PAT offline and bind `auth` in a local
# profile extending your language profile (without duplicating the unauthenticated `api.github.com` `/` rule):
#
#   SEALED=$(printf '%s' "$GH_PAT" | blackwall secret seal --raw \
#     --name GITHUB_TOKEN --hosts api.github.com,github.com --paths / --exp-sec 7200)
#   blackwall create --profile ts-dev \
#     --secret "GITHUB_TOKEN=$SEALED" \
#     --allow-http "GET,POST,PUT,PATCH:api.github.com/:GITHUB_TOKEN" \
#     --allow-http "GET,HEAD,POST:github.com/:GITHUB_TOKEN"

version = 1
name = "github"
extends = ["base"]

[image]
base = "debian:bookworm-slim"
packages = [
  "ca-certificates",
  "git",
  "curl",
  "jq",
]
run = [
  "curl -fsSL https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local",
  "mkdir -p /workspace /home/sandbox && useradd -m -u 1000 -s /bin/bash sandbox 2>/dev/null || true && chown -R 1000:1000 /workspace /home/sandbox",
]

[network]
mode = "egress"

# Smart HTTP git clone/fetch/push (`git-upload-pack` & `git-receive-pack` use POST)
[[network.http]]
host = "github.com"
methods = ["GET", "HEAD", "POST"]
path_prefixes = ["/"]

# GitHub REST + GraphQL API (`gh` uses POST /graphql even for reads)
[[network.http]]
host = "api.github.com"
methods = ["GET", "HEAD", "POST", "PUT", "PATCH"]
path_prefixes = ["/"]

[[network.http]]
host = "raw.githubusercontent.com"
methods = ["GET", "HEAD"]
path_prefixes = ["/"]

[[network.http]]
host = "objects.githubusercontent.com"
methods = ["GET", "HEAD"]
path_prefixes = ["/"]

[[network.http]]
host = "codeload.github.com"
methods = ["GET", "HEAD"]
path_prefixes = ["/"]

[env]
GIT_TERMINAL_PROMPT = "0"
GH_PROMPT_DISABLED = "1"
GH_NO_UPDATE_NOTIFIER = "1"
