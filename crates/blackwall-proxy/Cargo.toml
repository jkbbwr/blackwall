[package]
name = "blackwall-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blackwall-audit.workspace = true
blackwall-policy.workspace = true
blackwall-proto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
rand.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

async-trait = "0.1"
bytes = "1"
http = "1"
percent-encoding = "2"
subtle = "2"
url = "2"

pingora-core = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-proxy = { version = "0.9", default-features = false, features = ["rustls"] }
pingora-http = "0.9"
pingora-error = "0.9"
pingora-rustls = "0.9"

rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"
